name: macd-ichimoku-scanner

on:
  workflow_dispatch:
  schedule:
        - cron: '5 * * * *'


jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: check-repo
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: install-libs
        run: |
          pip install ccxt pandas numpy requests

      - name: run-bot-script
        run: python bot.py
