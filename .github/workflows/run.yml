name: MACD Сканер Ишимоку 24/7

on:
  workflow_dispatch: # Оставляет возможность запускать вручную
  schedule:
    - cron: '*/5 * * * *' # ИДЕАЛЬНО: Автозапуск каждые 5 минут круглые сутки

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-python: '3.10'

      - name: Установка библиотек
        run: |
          pip install ccxt pandas numpy requests

      - name: Запуск сканера
        run: run: python bot.py

